<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Daria Shtareva</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: white;
            color: black;
            line-height: 1.6;
            padding: 40px 20px;
            max-width: 800px;
            margin: 0 auto;
        }
        
        header {
            text-align: center;
            margin-bottom: 60px;
        }
        
        h1 {
            font-size: 48px;
            font-weight: 700;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }
        
        .subtitle {
            font-size: 20px;
            font-weight: 400;
            color: #666;
            margin-bottom: 30px;
        }
        
        .subtitle-text {
            display: block;
            margin-bottom: 8px;
        }
        
        .subtitle-contacts {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            font-size: 14px;
        }
        
        .subtitle-contact-link {
            color: #999;
            text-decoration: none;
            padding: 2px 8px;
            border-radius: 12px;
            transition: all 0.2s;
        }
        
        .subtitle-contact-link:hover {
            color: black;
            background: #f5f5f5;
        }
        
        .subtitle-contact-link::after {
            content: '·';
            margin-left: 10px;
            color: #ccc;
        }
        
        .subtitle-contact-link:last-child::after {
            content: '';
            margin-left: 0;
        }
        
        .scroll-indicator {
            text-align: center;
            margin: 20px 0;
            font-size: 24px;
            color: #999;
        }
        
        .filter-tags {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
            margin-bottom: 40px;
        }
        
        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.2s;
            text-decoration: none;
            color: black;
        }
        
        .tag:hover {
            background: #e8e8e8;
        }
        
        .tag.active {
            background: black;
            color: white;
            border-color: black;
        }
        
        .separator {
            height: 1px;
            background: #e0e0e0;
            margin: 40px 0;
        }
        
        .section {
            margin-bottom: 50px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            text-transform: lowercase;
        }
        
        .video-placeholder {
            width: 100%;
            height: 400px;
            background: #f0f0f0;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #999;
            font-size: 14px;
        }
        
        .contacts {
            margin-top: 60px;
        }
        
        .contacts-title {
            font-size: 18px;
            font-weight: 500;
            margin-bottom: 20px;
            text-transform: lowercase;
        }
        
        .contact-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }
        
        .contact-tag {
            padding: 8px 16px;
            border-radius: 20px;
            background: #f5f5f5;
            border: 1px solid #e0e0e0;
            text-decoration: none;
            color: black;
            font-size: 14px;
            transition: all 0.2s;
        }
        
        .contact-tag:hover {
            background: #e8e8e8;
        }
        
        .video-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        
        .video-container {
            width: 100%;
            position: relative;
            padding-bottom: 56.25%;
            height: 0;
            overflow: hidden;
            border-radius: 8px;
            background: #f0f0f0;
        }
        
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        
        @media (min-width: 768px) {
            .video-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }
    </style>
  </head>
  <body>
    <header>
        <h1>Daria Shtareva</h1>
        <div class="subtitle">
            <span class="subtitle-text">editor</span>
            <div class="subtitle-contacts">
                <a href="https://t.me/dasha_sh_canal" class="subtitle-contact-link" target="_blank">telegram</a>
                <a href="mailto:irandasha@gmail.com" class="subtitle-contact-link">mail</a>
                <a href="https://www.instagram.com/dasha_sh_canal/" class="subtitle-contact-link" target="_blank">instagram</a>
                <a href="tel:+79165868986" class="subtitle-contact-link">phone</a>
            </div>
        </div>
        <div class="scroll-indicator">↓</div>
    </header>
    
    <div class="filter-tags" id="filter-tags">
        <a href="#" class="tag active" data-category="all">follow up</a>
        <a href="#" class="tag" data-category="shorts">shorts & reels</a>
        <a href="#" class="tag" data-category="art">art video</a>
        <a href="#" class="tag" data-category="youtube">youtube show</a>
        <a href="#" class="tag" data-category="promo">promo</a>
        <a href="#" class="tag" data-category="backstage">backstage</a>
    </div>
    
    <div class="separator"></div>
    
    <div id="content-sections">
        <div class="section" data-category="follow-up">
            <div class="section-title">follow up</div>
            <div class="video-grid" id="follow-up-videos"></div>
        </div>
        
        <div class="separator"></div>
        
        <div class="section" data-category="backstage">
            <div class="section-title">backstage</div>
            <div class="video-grid" id="backstage-videos"></div>
        </div>
        
        <div class="separator"></div>
        
        <div class="section" data-category="shorts">
            <div class="section-title">shorts & reels</div>
            <div class="video-grid" id="shorts-videos"></div>
        </div>
        
        <div class="separator"></div>
        
        <div class="section" data-category="art">
            <div class="section-title">art video</div>
            <div class="video-grid" id="art-videos"></div>
        </div>
        
        <div class="separator"></div>
        
        <div class="section" data-category="youtube">
            <div class="section-title">youtube show</div>
            <div class="video-grid" id="youtube-videos"></div>
        </div>
        
        <div class="separator"></div>
        
        <div class="section" data-category="promo">
            <div class="section-title">promo</div>
            <div class="video-grid" id="promo-videos"></div>
        </div>
    </div>
    
    <div class="separator"></div>
    
    <div class="contacts">
        <div class="contacts-title">contacts</div>
        <div class="contact-tags">
            <a href="https://t.me/dasha_sh_canal" class="contact-tag" target="_blank">telegram</a>
            <a href="mailto:irandasha@gmail.com" class="contact-tag">mail</a>
            <a href="https://www.instagram.com/dasha_sh_canal/" class="contact-tag" target="_blank">instagram</a>
            <a href="tel:+79165868986" class="contact-tag">phone</a>
        </div>
    </div>

    <script src="https://player.vimeo.com/api/player.js"></script>
    
    <script>
        const videoSections = {
            'promo': [
                { type: 'youtube', id: 'qZW25xPU9q4' },
                { type: 'youtube', id: 'EKYlux0ZtRU' },
                { type: 'youtube', id: 'xByFGGXiSoo' },
                { type: 'youtube', id: 'eeIe8f6yQZk' },
                { type: 'youtube', id: 'eKMT3AO_diM' },
                { type: 'vimeo', id: '756756260' },
                { type: 'vimeo', id: '669383502' },
                { type: 'vimeo', id: '522710223' },
                { type: 'vimeo', id: '668932521' },
                { type: 'youtube', id: 'HHIGU1R1N3c' },
                { type: 'vimeo', id: '668942634' }
            ],
            'youtube': [
                { type: 'youtube', id: 'O3nBkD9EjrU' },
                { type: 'youtube', id: 'K-a9J_Ot3eo' },
                { type: 'youtube', id: 'V4tq57vIRtI' },
                { type: 'youtube', id: '8TgBN7fY9ac' },
                { type: 'youtube', id: 'H60vvYaWYQg' },
                { type: 'youtube', id: 'jS9UWbRoUrA' },
                { type: 'youtube', id: 'ysxZXrXw2M0' },
                { type: 'youtube', id: 'A1KHmnMkAxw' },
            ],
            'shorts': [
                { type: 'youtube', id: 'FmeGuXKt16U' },
                { type: 'youtube', id: 't8KweKG__io' },
                { type: 'youtube', id: '0yTRy2Ut40o' },
                { type: 'youtube', id: '3tllq7LXjN8' },
                { type: 'youtube', id: 'YHOf0xni_Ac' },
                { type: 'youtube', id: 'UPO0_QTw2aQ' }
            ],
            'art': [
                { type: 'vimeo', id: '668933164' },
                { type: 'vimeo', id: '334873436' },
                { type: 'vimeo', id: '668929927' },
                { type: 'vimeo', id: '669382180' },
                { type: 'youtube', id: 'm6m4FNQkptY' }
            ],
            'follow-up': [],
            'backstage': []
        };

        function createVideoEmbed(video) {
            const container = document.createElement('div');
            container.className = 'video-container';
            
            let iframe;
            if (video.type === 'youtube') {
                iframe = `<iframe src="https://www.youtube.com/embed/${video.id}" 
                    title="YouTube video player" frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    allowfullscreen></iframe>`;
            } else if (video.type === 'vimeo') {
                iframe = `<iframe src="https://player.vimeo.com/video/${video.id}?h=864d2e9ba6&amp;badge=0&amp;autopause=0&amp;player_id=0&amp;app_id=58479" 
                    frameborder="0" allow="autoplay; fullscreen; picture-in-picture" 
                    allowfullscreen></iframe>`;
            }
            
            container.innerHTML = iframe;
            return container;
        }

        function renderVideos() {
            Object.keys(videoSections).forEach(category => {
                const container = document.getElementById(`${category}-videos`);
                if (!container) return;
                
                const videos = videoSections[category];
                if (videos.length === 0) {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'video-placeholder';
                    placeholder.textContent = 'Coming soon';
                    container.appendChild(placeholder);
                } else {
                    videos.forEach(video => {
                        container.appendChild(createVideoEmbed(video));
                    });
                }
            });
        }

        function setupFilters() {
            const tags = document.querySelectorAll('.tag');
            const sections = document.querySelectorAll('.section');
            
            tags.forEach(tag => {
                tag.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    tags.forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    
                    const category = tag.getAttribute('data-category');
                    
                    sections.forEach(section => {
                        if (category === 'all') {
                            section.style.display = 'block';
                        } else {
                            const sectionCategory = section.getAttribute('data-category');
                            if (sectionCategory === category) {
                                section.style.display = 'block';
                            } else {
                                section.style.display = 'none';
                            }
                        }
                    });
                    
                    const separators = document.querySelectorAll('.separator');
                    separators.forEach(sep => {
                        sep.style.display = category === 'all' ? 'block' : 'none';
                    });
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderVideos();
            setupFilters();
        });
    </script>
  </body>
</html>
