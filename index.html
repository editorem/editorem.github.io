    <script>

                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/clip/Lovers%20Abracadabra%20cover.mp4' },
                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/clip/%C2%A0II%202025.08.13%20Anja%20Vintage.mp4'},
                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/clip/Britney%20Spears%20360.mp4', vertical: true },
                { type: 'vimeo', id: '1142070694'},

            ],
            'backstage': [
                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/backstage/%201_Lovers%20backstage.mp4', vertical: true },
                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/backstage/2%20Lovers%20backstage.mp4', vertical: true },
                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/backstage/2025.08.04%20Alemana.mp4', vertical: true },
                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/backstage/4%20Drama%20Queen%20backstage.mp4', vertical: true },
                { type: 'direct', url: 'https://pub-254c67bd105e4309adfbc2375c0923c5.r2.dev/backstage/5%20Arsen%20show%20backstage.mp4', vertical: true }
            ]

        function extractYouTubeId(urlOrId) {
            // If it's already just an ID, return it
            if (!urlOrId.includes('youtube.com') && !urlOrId.includes('youtu.be') && !urlOrId.includes('http')) {
                return urlOrId.split('&')[0].split('?')[0];
            }
            
            // Extract ID from various YouTube URL formats
            const patterns = [
                /(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\n?#]+)/,
                /youtube\.com\/.*[?&]v=([^&\n?#]+)/
            ];
            
            for (const pattern of patterns) {
                const match = urlOrId.match(pattern);
                if (match) {
                    return match[1].split('&')[0].split('?')[0];
                }
            }
            
            return urlOrId.split('&')[0].split('?')[0];
        }
        
        function createVideoEmbed(video) {
            const container = document.createElement('div');
            container.className = 'video-container';
            
            if (video.vertical) {
                container.classList.add('vertical');
            }
            
            let content;
            if (video.type === 'youtube') {
                const videoId = extractYouTubeId(video.id);
                const siParam = video.si ? `?si=${video.si}` : '';
                
                content = `<iframe src="https://www.youtube.com/embed/${videoId}${siParam}" 
                    title="YouTube video player" 
                    frameborder="0" 
                    allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" 
                    referrerpolicy="strict-origin-when-cross-origin"
                    allowfullscreen></iframe>`;
            } else if (video.type === 'vimeo') {
                content = `<iframe src="https://player.vimeo.com/video/${video.id}?badge=0&autopause=0" 
                    frameborder="0" 
                    allow="autoplay; fullscreen; picture-in-picture" 
                    allowfullscreen></iframe>`;
            } else if (video.type === 'direct') {
                content = `<video controls preload="metadata">
                    <source src="${video.url}" type="video/mp4">
                    Your browser does not support the video tag.
                </video>`;
            }
            
            container.innerHTML = content;
            return container;
        }

        function renderVideos() {
            Object.keys(videoSections).forEach(category => {
                const container = document.getElementById(`${category}-videos`);
                if (!container) return;
                
                const videos = videoSections[category];
                if (videos.length === 0) {
                    const placeholder = document.createElement('div');
                    placeholder.className = 'video-placeholder';
                    placeholder.textContent = 'Coming soon';
                    container.appendChild(placeholder);
                } else {
                    videos.forEach(video => {
                        container.appendChild(createVideoEmbed(video));
                    });
                }
            });
        }

        function setupFilters() {
            const tags = document.querySelectorAll('.tag');
            const sections = document.querySelectorAll('.section');
            
            tags.forEach(tag => {
                tag.addEventListener('click', (e) => {
                    e.preventDefault();
                    
                    tags.forEach(t => t.classList.remove('active'));
                    tag.classList.add('active');
                    
                    const category = tag.getAttribute('data-category');
                    
                    sections.forEach(section => {
                        if (category === 'all') {
                            section.style.display = 'block';
                        } else {
                            const sectionCategory = section.getAttribute('data-category');
                            if (sectionCategory === category) {
                                section.style.display = 'block';
                            } else {
                                section.style.display = 'none';
                            }
                        }
                    });
                    
                    const separators = document.querySelectorAll('.separator');
                    separators.forEach(sep => {
                        sep.style.display = category === 'all' ? 'block' : 'none';
                    });
                });
            });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderVideos();
            setupFilters();
        });
    </script>
